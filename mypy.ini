[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = False

# Ignore specific files with third-party library complexity
[mypy-src.storage.upstash_cache]
ignore_errors = True

[mypy-src.storage.qdrant_store]
ignore_errors = True

# Ignore missing imports for third-party libraries
[mypy-radon.*]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-qdrant_client.*]
ignore_missing_imports = True

[mypy-neo4j.*]
ignore_missing_imports = True
