version: '3.8'

services:
  mcp-server:
    build: .
    ports:
      - "10000:10000"
    env_file:
      - .env
    environment:
      - MCP_SERVER_MODE=http
      - PORT=10000
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:10000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
